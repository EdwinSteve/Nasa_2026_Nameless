[project]
name="surco-backend"
version="0.1.0"
description="Backend for Surco"
requires-python=">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "argon2-cffi",
    "pyjwt",
    "phonenumbers",
    "email-validator",
    "pydantic (>=2.14.1,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]