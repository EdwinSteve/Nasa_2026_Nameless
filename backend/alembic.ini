# A generic, single database configuration.

[alembic]
# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = %(here)s/alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.  for multiple paths, the path separator
# is defined by "path_separator" below.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library and tzdata library.
# any string value that can be passed to zoneinfo.ZoneInfo() can be used here.
# timezone =

# The SQLAlchemy connection string to your database. In our case we leave it
# empty on purpose: alembic/env.py loads DATABASE_URL from .env via
# app.core.config.get_settings(). Do NOT hardcode credentials here.
sqlalchemy.url =

# version location specification; This defaults to
# <script_location>/versions
# When using multiple version directories, you may specify the
# `version_locations` as a ; separated list.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# version path separator; As mentioned above, this is the character used to split
# version_locations. If configured to `os`, the current os.pathsep is used
version_path_separator = os

# schema in which the alembic_version table will live.
# We deliberately don't set it here: env.py passes version_table_schema
# programmatically so the same config works for tests.
# version_table_schema = identidad

# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S